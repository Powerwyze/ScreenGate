name: taskassassin
description: "Questime turns time into quests with AI verification, personalized Handler coaching, and social accountability."
publish_to: "none"
version: 1.6.0+11

environment:
  sdk: ^3.6.0

dependencies:
  url_launcher: ^6.0.0
  permission_handler: ^12.0.0
  image: ^4.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cupertino_http: ^2.4.0
  shared_preferences: ^2.0.0
  image_picker: '>=1.1.2'
  http: ^1.0.0
  provider: ^6.0.0
  go_router: ^16.1.0
  intl: 0.20.2
  uuid: ^4.0.0
  supabase_flutter: '>=1.10.0'
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/ChatGPT_Image_Dec_2_2025_06_29_00_PM.png
  image_path: assets/images/ChatGPT_Image_Dec_2_2025_06_29_00_PM.png
  remove_alpha_ios: true
  adaptive_icon_background: "#4A7FA3"
  adaptive_icon_foreground: assets/images/ChatGPT_Image_Dec_2_2025_06_29_00_PM.png
